---
suite: test controllers
templates:
  - controllers/deployment.yaml
  - controllers/rbac.yaml
  - controllers/service.yaml
  - configmap.yaml
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 1.2.3
  appVersion: 1.2.3
tests:
  - it: image pull secrets are omitted by default
    template: controllers/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
  - it: shared image pull secrets are configurable
    template: controllers/deployment.yaml
    set:
      imagePullSecrets:
        - name: registry-primary
        - name: registry-secondary
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-primary
            - name: registry-secondary
  - it: manifests should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: deployment carries a config checksum annotation so configmap changes trigger a rolling restart
    template: controllers/deployment.yaml
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/config"]
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$
  - it: image pull policy is configurable
    template: controllers/deployment.yaml
    set:
      controllers.image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
  - it: applies the controllers resources to the controllers container
    template: controllers/deployment.yaml
    set:
      controllers.resources:
        requests:
          cpu: 1
          memory: 1Gi
        limits:
          cpu: 2
          memory: 4Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
  - it: does not apply the admission resources to the controllers container
    template: controllers/deployment.yaml
    set:
      admission.resources:
        limits:
          cpu: 9
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].resources
