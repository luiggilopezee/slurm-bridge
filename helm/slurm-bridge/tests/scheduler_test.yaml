---
suite: test scheduler
templates:
  - scheduler/deployment.yaml
  - scheduler/configmap.yaml
  - scheduler/rbac.yaml
  - scheduler/serviceaccount.yaml
  - configmap.yaml
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 1.2.3
  appVersion: 1.2.3
tests:
  - it: digest takes precedence over an explicit tag
    template: scheduler/deployment.yaml
    set:
      scheduler.image.repository: registry.example.org/scheduler
      scheduler.image.tag: ignored
      scheduler.image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.org/scheduler@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - it: explicit tag remains supported without a digest
    template: scheduler/deployment.yaml
    set:
      scheduler.image.tag: custom
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/slinkyproject/slurm-bridge-scheduler:custom
  - it: image pull secrets are omitted by default
    template: scheduler/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
  - it: shared image pull secrets are configurable
    template: scheduler/deployment.yaml
    set:
      imagePullSecrets:
        - name: registry-primary
        - name: registry-secondary
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-primary
            - name: registry-secondary
  - it: manifests should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: deployment carries config checksum annotations so configmap changes trigger a rolling restart
    template: scheduler/deployment.yaml
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/config"]
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/scheduler-config"]
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/scheduler-config"]
          pattern: ^[0-9a-f]{64}$
  - it: image pull policy is configurable
    template: scheduler/deployment.yaml
    set:
      scheduler.image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
  - it: scheduler can update its leader election lease
    template: scheduler/rbac.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - create
              - get
              - list
              - update
