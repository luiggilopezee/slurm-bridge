---
suite: test scheduler
templates:
  - scheduler/deployment.yaml
  - scheduler/configmap.yaml
  - scheduler/rbac.yaml
  - scheduler/serviceaccount.yaml
  - configmap.yaml
release:
  name: test-release
  namespace: test-namespace
chart:
  version: 1.2.3
  appVersion: 1.2.3
tests:
  - it: references an externally managed credential without embedding it
    template: scheduler/deployment.yaml
    set:
      sharedConfig.slurmJwtSecret: externally-managed-slurm-token
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SLURM_JWT
            valueFrom:
              secretKeyRef:
                name: externally-managed-slurm-token
                key: auth-token
  - it: image digest takes precedence over tag
    template: scheduler/deployment.yaml
    set:
      scheduler.image.repository: registry.example.org/bridge-scheduler
      scheduler.image.tag: ignored
      scheduler.image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.example.org/bridge-scheduler@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - it: image tag is used without a digest
    template: scheduler/deployment.yaml
    set:
      scheduler.image.tag: fork-test
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/slinkyproject/slurm-bridge-scheduler:fork-test
  - it: manifests should match snapshot
    asserts:
      - matchSnapshot: {}
  - it: deployment carries config checksum annotations so configmap changes trigger a rolling restart
    template: scheduler/deployment.yaml
    asserts:
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/config"]
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/config"]
          pattern: ^[0-9a-f]{64}$
      - isNotNullOrEmpty:
          path: spec.template.metadata.annotations["checksum/scheduler-config"]
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/scheduler-config"]
          pattern: ^[0-9a-f]{64}$
  - it: image pull policy is configurable
    template: scheduler/deployment.yaml
    set:
      scheduler.image.pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
  - it: scheduler can update its leader election lease
    template: scheduler/rbac.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups:
              - coordination.k8s.io
            resources:
              - leases
            verbs:
              - create
              - get
              - list
              - update
